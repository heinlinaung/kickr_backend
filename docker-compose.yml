services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Overrides whatever MONGODB_URI is in .env — compose applies
      # `environment` AFTER `env_file`, so a local run never touches the Atlas
      # cluster the checked-out .env points at. That precedence is the whole
      # reason this line is safe.
      MONGODB_URI: mongodb://mongo:27017/kickr
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
  uploads:
